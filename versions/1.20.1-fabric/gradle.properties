# Fabric 走 Loom（modstitch.platform=loom）：映射直接用官方 Mojang 映射 + Parchment，
# 所以 src/ 里 player.level()、getDayTime() 这类写法不用翻译成 Yarn 名
modstitch.platform=loom

deps.minecraft=1.20.1
# 与 1.20.1 Forge 变体保持同一份 Parchment，保证两侧源码的参数名一致
deps.parchment=2023.09.03

# Fabric Loader 取当前稳定版（0.16 起需 Java 17，1.19.2/1.20.1/1.21.1 服务端本就跑 17/21）
deps.fabricLoader=0.20.1
# Fabric API 必须与 MC 版本对号入座；/realDamage 命令依赖它的 CommandRegistrationCallback
deps.fabricApi=0.92.12+1.20.1
