# Fabric 走 Loom（modstitch.platform=loom）
modstitch.platform=loom

deps.minecraft=26.2

# Fabric Loader 0.20.1 是当前最新稳定版，26.2 的版本清单里就列着它（Fabric API 只要求 >=0.18.4）
deps.fabricLoader=0.20.1
# 26.2 对应的 Fabric API 分支，最后一个版本号（该分支所有构建都是用 Loom 1.16.2 做的）
deps.fabricApi=0.161.0+26.2
# Fabric API 的 bundle 在 26.x 里不再包含 gametest 模块，只能单独指定；
# 该模块的 manifest 写着 Fabric-Minecraft-Version: 26.2 / Fabric-Loom-Version: 1.16.2
deps.fabricGametest=4.0.22+4a7fa0819e
# 不设 deps.parchment：与 neoforge 变体同因，Parchment 没有 26.x 的数据
