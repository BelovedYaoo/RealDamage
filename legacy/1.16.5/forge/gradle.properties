# ForgeGradle 4.1 在 apply 时会对 https://maven.minecraftforge.net/ 与
# https://libraries.minecraft.net/ 各做一次直连 HTTPS 连通性检查（Utils.testServerConnection），
# 它用的是 JDK 自己的 HttpsURLConnection，不走 Gradle 的代理配置，在本机（必须走
# 127.0.0.1:7890 代理）会直接抛 SSLHandshakeException 让整个构建失败。
# 这项检查只是「提醒你网络不通」，真正的依赖下载仍然走 Gradle 自己的 HTTP 栈（代理已配在
# GRADLE_USER_HOME/gradle.properties 里），所以这里关掉它。
systemProp.net.minecraftforge.gradle.test_certs=false

# ForgeGradle 的反编译/打补丁很吃内存
org.gradle.jvmargs=-Xmx3G
