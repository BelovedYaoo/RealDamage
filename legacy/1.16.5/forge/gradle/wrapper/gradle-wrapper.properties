# Forge 侧必须是 Gradle 6.x：ForgeGradle 4.1.16 在 apply 阶段就硬性拒绝 7.0+，
# 原始报错 "Found Gradle version Gradle 7.5.1. Versions Gradle 7.0 and newer are
# not supported yet. Note: Support for Gradle 7 will be added in ForgeGradle 5."
# 这与 1.16.5 年代的 MDK 一致（那一代用的是 Gradle 6.8/6.9）。
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-6.9.4-bin.zip
networkTimeout=60000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
